# fly.toml — `fly launch --copy-config` then `fly deploy`.
# Pick the region nearest your players: bom (Mumbai) is the closest to the Gulf.
app = "sheeple"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Rooms live in memory, so a sleeping machine would drop games in progress.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
