<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bread or Dead</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍞</text></svg>" />
  <style>
    :root {
      --crust: #b5793c;
      --crumb: #fff3d6;
      --mold: #6fbf4a;
      --char: #2a1d12;
      --panel: rgba(28, 20, 14, 0.92);
      --stroke: rgba(255, 226, 174, 0.25);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #120d09; }
    body {
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: var(--crumb);
      -webkit-font-smoothing: antialiased;
    }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; }

    .layer {
      position: fixed; inset: 0;
      display: none;
      pointer-events: none;
    }
    .layer.on { display: block; }
    .layer.center { display: none; place-items: center; }
    .layer.center.on { display: grid; pointer-events: auto; overflow: auto; padding: 16px; }

    .panel {
      background: var(--panel);
      border: 2px solid var(--stroke);
      border-radius: 18px;
      padding: 26px 30px;
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
      max-width: min(92vw, 640px);
      width: 100%;
      /* Short windows (and the meeting overlay) must never push a button off-screen. */
      max-height: 96vh;
      overflow-y: auto;
    }
    h1 {
      font-size: clamp(34px, 7vw, 64px);
      margin: 0 0 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff3d6, #d79a4d);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 4px 0 rgba(0,0,0,.35);
    }
    .tagline { margin: 0 0 20px; opacity: .7; font-size: 14px; letter-spacing: 1px; }
    h2 { margin: 0 0 12px; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; }

    button, .btn {
      font: inherit; font-weight: 700; letter-spacing: .5px;
      background: linear-gradient(180deg, #e0a45c, #b5793c);
      color: #2a1d12;
      border: 2px solid #7d5227; border-radius: 12px;
      padding: 11px 18px; cursor: pointer;
      transition: transform .08s ease, filter .12s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:active:not(:disabled) { transform: translateY(2px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--crumb); border-color: var(--stroke); }
    button.danger { background: linear-gradient(180deg, #e06a4c, #a63c26); color: #fff2e6; border-color: #6d2415; }
    button.mold { background: linear-gradient(180deg, #8fd96a, var(--mold)); border-color: #3f7a29; }

    input[type=text] {
      font: inherit; width: 100%;
      background: rgba(0,0,0,.35); color: var(--crumb);
      border: 2px solid var(--stroke); border-radius: 12px;
      padding: 11px 14px;
    }
    input[type=text]::placeholder { color: rgba(255,243,214,.35); }
    label { display: block; font-size: 12px; letter-spacing: 1px; opacity: .6; margin: 0 0 6px; text-transform: uppercase; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .stack { display: grid; gap: 14px; }
    .error { color: #ff9b7d; min-height: 18px; font-size: 13px; margin-top: 6px; }
    .muted { opacity: .6; font-size: 13px; }

    /* ---- lobby ---- */
    #lobby-players { display: grid; gap: 8px; margin: 14px 0; max-height: 34vh; overflow-y: auto; }
    .lobby-row {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,.05); border-radius: 10px; padding: 8px 12px;
    }
    .swatch { width: 22px; height: 24px; border-radius: 4px 4px 9px 9px; border: 2px solid #8a5c2c; }
    .code {
      font-size: 40px; letter-spacing: 12px; font-weight: 800;
      color: #ffd98a; text-align: center; margin: 4px 0 0;
    }

    /* ---- HUD ---- */
    #hud { font-size: 14px; }
    #hud .corner { position: absolute; pointer-events: none; }
    #hud-top {
      top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .timer {
      background: var(--panel); border: 2px solid var(--stroke); border-radius: 999px;
      padding: 6px 20px; font-weight: 800; font-size: 22px; letter-spacing: 2px;
    }
    .timer.danger { color: #ff9b7d; border-color: #ff9b7d; }
    .taskbar {
      width: min(46vw, 420px); height: 14px; border-radius: 999px;
      background: rgba(0,0,0,.55); border: 2px solid var(--stroke); overflow: hidden;
    }
    .taskbar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ffd98a, #8fd96a); transition: width .3s; }
    #hud-tasks { top: 12px; left: 12px; width: min(30vw, 280px); }
    .card { background: var(--panel); border: 2px solid var(--stroke); border-radius: 14px; padding: 10px 12px; }
    .task-item { display: grid; gap: 3px; margin-bottom: 9px; }
    .task-item:last-child { margin-bottom: 0; }
    .task-name { font-weight: 700; font-size: 13px; }
    .task-item.done .task-name { color: var(--mold); text-decoration: line-through; opacity: .7; }
    .task-hint { font-size: 11px; opacity: .55; line-height: 1.3; }
    .mini { height: 6px; border-radius: 999px; background: rgba(0,0,0,.5); overflow: hidden; }
    .mini > i { display: block; height: 100%; width: 0; background: #ffd98a; }
    #hud-abilities { bottom: 12px; left: 12px; display: flex; gap: 8px; }
    .ability {
      pointer-events: auto; position: relative; width: 74px; height: 74px;
      background: var(--panel); border: 2px solid var(--stroke); border-radius: 14px;
      display: grid; place-content: center; text-align: center; gap: 2px;
      cursor: pointer; user-select: none;
    }
    .ability .k { font-size: 11px; opacity: .5; }
    .ability .n { font-size: 11px; font-weight: 700; line-height: 1.1; }
    .ability .cd {
      position: absolute; inset: 0; border-radius: 12px;
      background: rgba(0,0,0,.7); display: grid; place-content: center;
      font-weight: 800; font-size: 18px;
    }
    .ability.ready { border-color: var(--mold); }
    #hud-actions { bottom: 12px; right: 12px; display: flex; gap: 8px; }
    /* Beat the `#hud .corner { pointer-events: none }` rule above. */
    #hud .corner#hud-actions, #hud .corner#hud-abilities { pointer-events: auto; }
    #hud-role {
      top: 12px; right: 12px; text-align: right;
    }
    .role-badge { font-weight: 800; letter-spacing: 2px; }
    .role-badge.moldy { color: var(--mold); }
    .role-badge.fresh { color: #ffd98a; }
    #hud-log { bottom: 100px; left: 50%; transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; }
    .log-line {
      background: rgba(0,0,0,.6); border-radius: 999px; padding: 4px 14px; font-size: 13px;
      animation: floataway 4s forwards;
    }
    @keyframes floataway { 0% { opacity: 0; transform: translateY(8px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
    .banner {
      position: absolute; top: 32%; left: 50%; transform: translateX(-50%);
      font-size: clamp(24px, 5vw, 48px); font-weight: 900; letter-spacing: 3px;
      text-transform: uppercase; color: #ff9b7d; text-shadow: 0 4px 0 rgba(0,0,0,.5);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { to { transform: translateX(-50%) scale(1.06); } }

    /* ---- meeting ---- */
    #meeting { background: rgba(10,7,4,.86); backdrop-filter: blur(4px); }
    #meeting.on { display: grid; place-items: center; pointer-events: auto; }
    .meeting-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; width: min(94vw, 900px); }
    @media (max-width: 720px) { .meeting-grid { grid-template-columns: 1fr; } }
    .vote-list { display: grid; gap: 8px; max-height: 46vh; overflow-y: auto; }
    .vote-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      background: rgba(255,255,255,.05); border: 2px solid transparent; border-radius: 10px;
      cursor: pointer;
    }
    .vote-row:hover { border-color: var(--stroke); }
    .vote-row.dead { opacity: .35; cursor: not-allowed; }
    .vote-row.voted { border-color: #ffd98a; }
    .vote-row .tally { margin-left: auto; font-weight: 800; color: #ffd98a; }
    #chat-log {
      height: 34vh; overflow-y: auto; display: grid; gap: 5px; align-content: start;
      background: rgba(0,0,0,.35); border-radius: 10px; padding: 10px; font-size: 13px;
    }
    .chat-msg b { color: #ffd98a; }
    .chat-msg.dead b { color: #9aa7b5; }
    .chat-msg.system { opacity: .6; font-style: italic; }
    #chat-form { display: flex; gap: 8px; margin-top: 8px; }
    #chat-form input { flex: 1; }
    #chat-form button { flex: 0 0 auto; }

    /* ---- game over ---- */
    #gameover .panel { text-align: center; }
    .winner { font-size: clamp(28px, 6vw, 52px); font-weight: 900; letter-spacing: 3px; margin: 0 0 6px; }
    .winner.fresh { color: #ffd98a; }
    .winner.moldy { color: var(--mold); }

    .kbd {
      display: inline-block; background: rgba(255,255,255,.08); border: 1px solid var(--stroke);
      border-bottom-width: 3px; border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 700;
    }
    .help { font-size: 12px; opacity: .65; line-height: 1.7; }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Menu / lobby ------------------------------------------------------ -->
  <div id="menu" class="layer center on">
    <div class="panel">
      <h1>Bread or Dead</h1>
      <p class="tagline">One slice among you is mouldering.</p>

      <div id="menu-home" class="stack">
        <div>
          <label for="name">Your loaf</label>
          <input id="name" type="text" maxlength="14" placeholder="Sourdough" />
        </div>
        <div class="row">
          <button id="btn-solo" class="mold">Solo vs. AI</button>
          <button id="btn-create">Create room</button>
        </div>
        <div class="row">
          <input id="join-code" type="text" maxlength="4" placeholder="CODE" style="text-transform:uppercase" />
          <button id="btn-join" class="ghost">Join</button>
        </div>
        <p class="error" id="menu-error"></p>
        <p class="help">
          <span class="kbd">A</span><span class="kbd">D</span> tilt &nbsp;·&nbsp;
          <span class="kbd">W</span><span class="kbd">S</span> flop forward/back &nbsp;·&nbsp;
          <span class="kbd">SPACE</span> hop &nbsp;·&nbsp;
          <span class="kbd">E</span> grab / report &nbsp;·&nbsp;
          <span class="kbd">C</span> coo &nbsp;·&nbsp;
          <span class="kbd">Q</span> scream
        </p>
      </div>

      <div id="menu-lobby" class="stack" hidden>
        <h2>Room</h2>
        <p class="code" id="lobby-code">----</p>
        <div id="lobby-players"></div>
        <p class="muted" id="lobby-hint"></p>
        <div class="row">
          <button id="btn-start">Start game</button>
          <button id="btn-leave" class="ghost">Leave</button>
        </div>
        <p class="error" id="lobby-error"></p>
      </div>
    </div>
  </div>

  <!-- HUD ---------------------------------------------------------------- -->
  <div id="hud" class="layer">
    <div class="corner" id="hud-top">
      <div class="timer" id="hud-timer">1:00</div>
      <div class="taskbar"><i id="hud-taskbar"></i></div>
    </div>
    <div class="corner card" id="hud-tasks"></div>
    <div class="corner card" id="hud-role"></div>
    <div class="corner" id="hud-abilities"></div>
    <div class="corner" id="hud-actions">
      <button id="btn-scream" class="danger">SCREAM!</button>
      <button id="btn-report" class="ghost" hidden>REPORT</button>
    </div>
    <div class="corner" id="hud-log"></div>
    <div class="banner" id="hud-banner" hidden></div>
  </div>

  <!-- Meeting ------------------------------------------------------------ -->
  <div id="meeting" class="layer">
    <div class="panel">
      <h2 id="meeting-title">Emergency Meeting</h2>
      <div class="meeting-grid">
        <div>
          <div id="chat-log"></div>
          <form id="chat-form" autocomplete="off">
            <input id="chat-input" type="text" maxlength="160" placeholder="Say something breadful…" />
            <button type="submit">Send</button>
          </form>
        </div>
        <div>
          <p class="muted" id="meeting-timer">60s</p>
          <div class="vote-list" id="vote-list"></div>
          <button id="btn-skip" class="ghost" style="width:100%;margin-top:10px">Skip vote</button>
          <p class="error" id="meeting-note"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Game over ----------------------------------------------------------- -->
  <div id="gameover" class="layer center">
    <div class="panel">
      <p class="winner" id="win-title">Fresh bread wins</p>
      <p class="muted" id="win-reason"></p>
      <div id="win-roles" class="stack" style="margin:16px 0"></div>
      <div class="row">
        <button id="btn-again">Back to menu</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
